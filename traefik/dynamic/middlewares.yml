http:
  middlewares:
    traefik-dashboard-auth:
      basicAuth:
        users:
          - "fstadmin:$apr1$RXLfOTtD$urWm6p27ynYXrg96b/Laf1"
        realm: "Traefik Dashboard"
        removeHeader: true

    security-headers:
      headers:
        browserXssFilter: true
        frameDeny: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 63072000
        referrerPolicy: "no-referrer"
        permissionsPolicy: >-
          camera=(), geolocation=(), microphone=(), payment=(), usb=()
        customResponseHeaders:
          X-Frame-Options: "DENY"
          X-Content-Type-Options: "nosniff"
          X-XSS-Protection: "1; mode=block"
          Cache-Control: "no-store"
          Pragma: "no-cache"

    ratelimit-low:
      rateLimit:
        average: 10
        burst: 5
        period: 1s

    ratelimit-medium:
      rateLimit:
        average: 20
        burst: 10
        period: 1s

    ratelimit-high:
      rateLimit:
        average: 30
        burst: 20
        period: 1s

    ip-whitelist:
      ipWhiteList:
        sourceRange:
          - "10.0.0.0/8"
          - "192.168.0.0/16"
          - "127.0.0.1/32"
        ipStrategy:
          depth: 1
