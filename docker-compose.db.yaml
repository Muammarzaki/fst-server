services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - be-internal
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - POSTGRES_DB=core_database
      - POSTGRES_USER=fst_user_screating_core
      - POSTGRES_PASSWORD=core_databaseDariDockerSwarm2025
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

volumes:
  postgres-data:

networks:
  db-network:
    external: true